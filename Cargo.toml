[workspace]
members = [
    "crates/core",
    "crates/exchanges",
    "crates/arbitrage",
    "crates/risk",
    "crates/gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Arbitrage Bot Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Concurrent data structures
dashmap = "5.5"
crossbeam = "0.8"
parking_lot = "0.12"

# Time precision
chrono = "0.4"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }

# Math and statistics
rust_decimal = "1.33"
rust_decimal_macros = "1.33"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# GUI (Tauri)
tauri = "1.5"
tauri-build = "1.5"

# WebSocket
tungstenite = "0.21"
url = "2.5"

# Metrics and monitoring
metrics = "0.21"
metrics-exporter-prometheus = "0.13"

# Performance optimization dependencies
jemallocator = "0.5"           # Fast allocator
rayon = "1.8"                  # Parallel iterators
simd-json = "0.13"             # Fast JSON parsing with SIMD
arrayvec = "0.7"               # Stack-allocated vectors
smallvec = "1.11"              # Small vector optimization
core_affinity = "0.8"          # CPU affinity
once_cell = "1.19"             # Lazy static without overhead

[profile.release]
opt-level = 3                    # Maximum optimization
lto = "fat"                      # Full link-time optimization
codegen-units = 1                # Single codegen unit for better inlining
panic = "abort"                  # Remove panic unwinding overhead
strip = true                     # Strip debug symbols
overflow-checks = false          # Disable integer overflow checks in release
debug = false                    # No debug info in release

# Ultra-performance profile for production
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

# Optimize dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 2
